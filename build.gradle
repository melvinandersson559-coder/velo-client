plugins {
    id 'fabric-loom' version "${loom_version}"
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    mavenCentral()
}

sourceSets {
    main {
        java {
            srcDir '.'
            include '*.java'
        }
        resources {
            srcDir '.'
            include 'fabric.mod.json'
            include 'velocli.mixins.json'
            exclude 'build/**'
            exclude '.gradle/**'
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
}

processResources {
    inputs.property "version", project.version
    inputs.property "minecraft_version", project.minecraft_version
    inputs.property "loader_version", project.loader_version
    filteringCharset "UTF-8"

    from('.') {
        include 'en_us.json', 'sv_se.json'
        into 'assets/velocli/lang'
    }

    filesMatching("fabric.mod.json") {
        expand "version": project.version,
               "minecraft_version": project.minecraft_version,
               "loader_version": project.loader_version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.encoding = "UTF-8"
    it.options.release = 21
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

jar {
    exclude 'com/terraformersmc/**'
    from("LICENSE") {
        rename { "${it}_${project.base.archivesName.get()}" }
    }
}

remapJar {
    doLast {
        def jarFile = archiveFile.get().asFile
        def zip = new java.util.zip.ZipFile(jarFile)
        def entries = zip.entries().collect { it.name }
        zip.close()
        def required = [
            "fabric.mod.json",
            "velocli.mixins.json",
            "com/velo/client/VeloClient.class",
            "com/velo/client/VeloTitleScreen.class",
            "com/velo/client/VeloModMenuIntegration.class",
            "com/velo/client/mixin/TitleScreenMixin.class"
        ]
        def missing = required.findAll { !entries.contains(it) }
        if (!missing.isEmpty()) {
            throw new GradleException("FEL: Saknar filer i .jar: " + missing + ". Kontrollera att alla .java-filer laddades upp i huvudmappen!")
        }
        println("VERIFIERAD OK: Alla VELO Client-filer finns i " + jarFile.name)
    }
}
