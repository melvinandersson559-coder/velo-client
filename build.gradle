plugins {
    id 'fabric-loom' version "${loom_version}"
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    mavenCentral()
}

def generatedResDir = file("${buildDir}/velo-generated-res")

tasks.register('prepareVeloResources') {
    outputs.dir(generatedResDir)
    doLast {
        delete(generatedResDir)
        generatedResDir.mkdirs()
        def langDir = new File(generatedResDir, "assets/velocli/lang")
        langDir.mkdirs()

        def foundModJson = fileTree(dir: '.', include: '**/fabric.mod.json', exclude: ['build/**', '.gradle/**']).files.find()
        if (foundModJson != null) {
            copy {
                from foundModJson
                into generatedResDir
            }
        } else {
            new File(generatedResDir, "fabric.mod.json").text = '''{
  "schemaVersion": 1,
  "id": "velocli",
  "version": "${version}",
  "name": "VELO Client",
  "description": "En stilren blaa Fabric-klientmod med VELO Title Screen, karaktarskort, favoritservrar, HUD och Toggle Sprint.",
  "authors": ["VELO"],
  "environment": "client",
  "entrypoints": {
    "client": [
      "com.velo.client.VeloClient"
    ],
    "modmenu": [
      "com.velo.client.VeloModMenuIntegration"
    ]
  },
  "mixins": [
    "velocli.mixins.json"
  ],
  "depends": {
    "fabricloader": ">=${loader_version}",
    "minecraft": "~${minecraft_version}",
    "java": ">=21",
    "fabric-api": "*"
  }
}'''
        }

        def foundMixinsJson = fileTree(dir: '.', include: '**/velocli.mixins.json', exclude: ['build/**', '.gradle/**']).files.find()
        if (foundMixinsJson != null) {
            copy {
                from foundMixinsJson
                into generatedResDir
            }
        } else {
            new File(generatedResDir, "velocli.mixins.json").text = '''{
  "required": true,
  "minVersion": "0.8",
  "package": "com.velo.client.mixin",
  "compatibilityLevel": "JAVA_21",
  "client": [
    "TitleScreenMixin"
  ],
  "injectors": {
    "defaultRequire": 1
  }
}'''
        }

        def foundEnUs = fileTree(dir: '.', include: '**/en_us.json', exclude: ['build/**', '.gradle/**']).files.find()
        if (foundEnUs != null) {
            copy { from foundEnUs; into langDir }
        } else {
            new File(langDir, "en_us.json").text = '{"key.velocli.menu": "Open VELO Client Menu"}'
        }

        def foundSvSe = fileTree(dir: '.', include: '**/sv_se.json', exclude: ['build/**', '.gradle/**']).files.find()
        if (foundSvSe != null) {
            copy { from foundSvSe; into langDir }
        } else {
            new File(langDir, "sv_se.json").text = '{"key.velocli.menu": "Öppna VELO Client Meny"}'
        }
    }
}

sourceSets {
    modmenuStub {
        java {
            srcDir '.'
            include '**/ModMenuApi.java'
            include '**/ConfigScreenFactory.java'
            exclude 'build/**'
            exclude '.gradle/**'
        }
    }
    main {
        java {
            srcDir '.'
            include '**/*.java'
            exclude '**/ModMenuApi.java'
            exclude '**/ConfigScreenFactory.java'
            exclude 'build/**'
            exclude '.gradle/**'
        }
        resources {
            srcDirs = [generatedResDir]
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    modmenuStubCompileOnly "com.mojang:minecraft:${project.minecraft_version}"
    modmenuStubCompileOnly "net.fabricmc:fabric-loader:${project.loader_version}"
    compileOnly sourceSets.modmenuStub.output
}

compileJava.dependsOn compileModmenuStubJava
processResources.dependsOn prepareVeloResources

processResources {
    inputs.property "version", project.version
    inputs.property "minecraft_version", project.minecraft_version
    inputs.property "loader_version", project.loader_version
    filteringCharset "UTF-8"

    filesMatching("fabric.mod.json") {
        expand "version": project.version,
               "minecraft_version": project.minecraft_version,
               "loader_version": project.loader_version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.encoding = "UTF-8"
    it.options.release = 21
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

jar {
    from("LICENSE") {
        rename { "${it}_${project.base.archivesName.get()}" }
    }
    doLast {
        def jarFile = archiveFile.get().asFile
        def zip = new java.util.zip.ZipFile(jarFile)
        def entries = zip.entries().collect { it.name }
        zip.close()
        def required = [
            "fabric.mod.json",
            "velocli.mixins.json",
            "com/velo/client/VeloClient.class",
            "com/velo/client/VeloTitleScreen.class",
            "com/velo/client/mixin/TitleScreenMixin.class"
        ]
        def missing = required.findAll { !entries.contains(it) }
        if (!missing.isEmpty()) {
            throw new GradleException("FEL: Saknar filer i .jar: " + missing + ". Kontrollera att alla .java-filer laddades upp!")
        }
        println("VERIFIERAD OK: Alla VELO Client-filer finns i " + jarFile.name)
    }
}
