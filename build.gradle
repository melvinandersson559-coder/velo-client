plugins {
    id 'fabric-loom' version "${loom_version}"
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    mavenCentral()
}

// Hitta code- och res-mapparna även om de råkat hamna i en undermapp vid uppladdning
def codeDir = file('code').exists() ? file('code') : (file('velo-client-1.21.11-v5/code').exists() ? file('velo-client-1.21.11-v5/code') : file('src/main/java'))
def resDir = file('res').exists() ? file('res') : (file('velo-client-1.21.11-v5/res').exists() ? file('velo-client-1.21.11-v5/res') : file('src/main/resources'))

sourceSets {
    modmenuStub {
        java {
            srcDir codeDir
            include 'ModMenuApi.java'
            include 'ConfigScreenFactory.java'
        }
    }
    main {
        java {
            srcDir codeDir
            exclude 'ModMenuApi.java'
            exclude 'ConfigScreenFactory.java'
        }
        resources {
            srcDir resDir
            exclude 'en_us.json'
            exclude 'sv_se.json'
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    modmenuStubCompileOnly "com.mojang:minecraft:${project.minecraft_version}"
    modmenuStubCompileOnly "net.fabricmc:fabric-loader:${project.loader_version}"
    compileOnly sourceSets.modmenuStub.output
}

compileJava.dependsOn compileModmenuStubJava

processResources {
    inputs.property "version", project.version
    inputs.property "minecraft_version", project.minecraft_version
    inputs.property "loader_version", project.loader_version
    filteringCharset "UTF-8"

    from(resDir) {
        include 'en_us.json', 'sv_se.json'
        into 'assets/velocli/lang'
    }

    filesMatching("fabric.mod.json") {
        expand "version": project.version,
               "minecraft_version": project.minecraft_version,
               "loader_version": project.loader_version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.encoding = "UTF-8"
    it.options.release = 21
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

jar {
    from("LICENSE") {
        rename { "${it}_${project.base.archivesName.get()}" }
    }
}
